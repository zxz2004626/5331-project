[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comp5331-graphbench"
version = "0.1.0"
description = "Structure- and time-aware synthetic graph anomaly evaluation"
readme = "README.txt"
requires-python = ">=3.10,<3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest==7.4.0", "ruff==0.17.4"]

[project.scripts]
graphbench = "graphbench.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"src/graphbench/workflows/*.py" = ["E402"]
"src/graphbench/evaluation.py" = ["F401"]
